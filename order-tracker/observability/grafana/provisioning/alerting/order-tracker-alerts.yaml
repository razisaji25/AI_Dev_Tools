apiVersion: 1

groups:
  - orgId: 1
    name: order-tracker
    folder: Order Tracker Alerts
    interval: 10s
    rules:
      - uid: order-tracker-5xx
        title: Order Tracker 5xx responses
        condition: B
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: sum(increase(http_server_requests_total{http_route!="/healthz", http_status_code=~"5.."}[5m])) or vector(0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              range: false
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        dashboardUid: order-tracker
        panelId: 3
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: Order Tracker returned a 5xx response
          description: The 5xx response count over the last 5 minutes is greater than zero.
          endpoint: http://localhost:8000/api/orders/standard-1002
          time_window: 5m
          dashboard_url: http://localhost:3000/d/order-tracker/order-tracker-requests-errors?viewPanel=3
        labels:
          service: order-tracker
          severity: warning
